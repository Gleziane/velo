name: Continuous Deployment Workflow


on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

env:
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:

  # 1. Executar testes unitários
  unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      # 1.1 Checkout do código
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1.2 Configuração do Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      # 1.3 Instalação das dependências
      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # 1.4 Execução dos testes unitários
      - name: Run unit tests
        run: yarn test:unit


  # 2. Build e Deploy do Preview na Vercel
  build-and-deploy:
    name: Build & Deploy Vercel Preview
    needs:
      - unit-tests

    runs-on: ubuntu-latest

    outputs:
      deployment-url: ${{ steps.deploy.outputs.deployment-url }}

    steps:
      # 2.1 Checkout do código
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2.2 Configuração do Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      # 2.3 Instalação das dependências
      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # 2.4 Obter as configurações do projeto na Vercel
      - name: Pull Vercel config
        run: yarn vercel pull --yes --environment=preview --token=$VERCEL_TOKEN

      # 2.5 Gerar o build da Vercel
      - name: Build for Vercel
        run: yarn vercel build --token=$VERCEL_TOKEN

      # 2.6 Fazer o deploy do Preview
      - name: Deploy Preview
        id: deploy
        run: |
          URL=$(yarn --silent vercel deploy --prebuilt --token=$VERCEL_TOKEN)
          echo "deployment-url=$URL" >> $GITHUB_OUTPUT


  # 3. Executar testes E2E
  e2e-tests:
    name: Run E2E Tests
    needs:
      - build-and-deploy

    runs-on: ubuntu-latest

    env:
      BASE_URL: ${{ needs.build-and-deploy.outputs.deployment-url }}

    steps:
      # 3.1 Checkout do código
      - name: Checkout repository
        uses: actions/checkout@v4

      # 3.2 Configuração do Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      # 3.3 Instalação das dependências
      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # 3.4 Instalação do Chromium
      - name: Install Playwright Browser
        run: yarn playwright install --with-deps chromium

      # 3.5 Execução dos testes E2E
      - name: Run E2E Tests
        run: yarn test:e2e

      # 3.6 Execução dos testes de regressão
      - name: Run Regression Tests
        run: yarn playwright test playwright/e2e/online.spec.ts

      # 3.7 Upload do relatório do Playwright
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-report
          path: playwright-report



        promote:
           name:     Promote to Production
           needs:    [e2e-tests, build-and-deploy]
           runs-on:   ubuntu-latest      

           steps:
            - name: Vercel promote
              run: |
                npx vercel@latest promote ${{ needs.build-and-deploy.outputs.deployment-url }} --token=$VERCEL_TOKEN --scope=$VERCEL_SCOPE --yes
             