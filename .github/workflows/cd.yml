
name: Continuous Deployment Workflow

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  # 1. Testes unitários
  unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run unit tests
        run: yarn test:unit

  # 2. Build e deploy de Preview na Vercel
  build-and-deploy:
    name: Build & Deploy Vercel Preview
    needs: unit-tests
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    outputs:
      deployment-url: ${{ steps.deploy.outputs.deployment-url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn

      - name: Validate Vercel secrets
        run: |
          test -n "$VERCEL_TOKEN" || {
            echo "::error::Secret VERCEL_TOKEN não configurado."
            exit 1
          }
          test -n "$VERCEL_ORG_ID" || {
            echo "::error::Secret VERCEL_ORG_ID não configurado."
            exit 1
          }
          test -n "$VERCEL_PROJECT_ID" || {
            echo "::error::Secret VERCEL_PROJECT_ID não configurado."
            exit 1
          }

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Pull Vercel configuration
        run: npx vercel@latest pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Build for Preview
        run: npx vercel@latest build --token="$VERCEL_TOKEN"

      - name: Deploy Preview
        id: deploy
        shell: bash
        run: |
          set -o pipefail

          DEPLOY_OUTPUT="$(npx vercel@latest deploy \
            --prebuilt \
            --target=preview \
            --token="$VERCEL_TOKEN" \
            --yes \
            --no-clipboard 2>&1)" || {
              printf '%s\n' "$DEPLOY_OUTPUT"
              echo "::error::O deploy de Preview falhou."
              exit 1
            }

          printf '%s\n' "$DEPLOY_OUTPUT"

          DEPLOYMENT_URL="$(printf '%s\n' "$DEPLOY_OUTPUT" \
            | grep -Eo 'https://[^[:space:]]+\.vercel\.app' \
            | tail -n 1 \
            | sed 's/[),]$//')"

          if [ -z "$DEPLOYMENT_URL" ]; then
            echo "::error::Não foi possível identificar a URL do deploy."
            exit 1
          fi

          echo "deployment-url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
          echo "Preview publicado: $DEPLOYMENT_URL"

  # 3. Testes E2E e regressão no Preview
  e2e-tests:
    name: Run E2E & Regression Tests
    needs: build-and-deploy
    if: github.event_name == 'push' && needs.build-and-deploy.result == 'success'
    runs-on: ubuntu-latest

    env:
      BASE_URL: ${{ needs.build-and-deploy.outputs.deployment-url }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Validate Preview URL
        run: |
          test -n "$BASE_URL" || {
            echo "::error::BASE_URL não foi definida."
            exit 1
          }
          echo "Testando Preview: $BASE_URL"

      - name: Install Playwright Chromium
        run: yarn playwright install --with-deps chromium

      - name: Run E2E tests
        run: yarn test:e2e

      - name: Run regression tests
        run: yarn playwright test playwright/e2e/online.spec.ts

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  # 4. Produção somente após sucesso na main
  promote:
    name: Promote to Production
    needs:
      - build-and-deploy
      - e2e-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build-and-deploy.result == 'success' && needs.e2e-tests.result == 'success'
    runs-on: ubuntu-latest

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      DEPLOYMENT_URL: ${{ needs.build-and-deploy.outputs.deployment-url }}

    steps:
      - name: Validate deployment
        run: |
          test -n "$VERCEL_TOKEN" || {
            echo "::error::Secret VERCEL_TOKEN não configurado."
            exit 1
          }
          test -n "$DEPLOYMENT_URL" || {
            echo "::error::URL do deploy não encontrada."
            exit 1
          }

      - name: Promote to Production
        run: |
          npx vercel@latest promote "$DEPLOYMENT_URL" \
            --token="$VERCEL_TOKEN" \
            --yes
