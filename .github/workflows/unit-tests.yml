name: Unit Tests

Verceel_TOKEN:vcp_4GdRxtB6aPi1fSYLcW3L8eGmfUVPoMaV5duW7W49NdzRCSgfXl2gDEwc
VERCEL_SCOPE:vercel.com/gleziane-alves
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run unit tests
        run: yarn test:unit


buid-and-deploy:
    name: Build & Deploy Vercel Preview
    needs: [unit-tests]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build project
        run: yarn build

      - name: Install dependencies
        run: yarn install

      # 5. Build para o Vercel
      - name: Build for Vercel
        run: yarn build build --token=$VERCEL_TOKEN

      #6. Deploy preview no vercel  
      - name: Deploy preview
        run: yarn vercel deploy --target=previewt --token=$VERCEL_TOKEN --scope=$VERCEL_SCOPE
